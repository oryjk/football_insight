# Football Insight Web admin; include inside the local233 gateway server.
location = /football-admin {
    return 301 /football-admin/;
}

location ^~ /football-admin/api/v1/admin/ {
    proxy_pass http://host.docker.internal:18092/api/v1/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /football-admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ^~ /football-admin/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /football-admin/index.html;
}
